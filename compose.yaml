name: newtalkopt

services:
  jenkins:
    build:
      context: ./jenkins
    image: newtalkopt/jenkins:local
    container_name: newtalkopt-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8090}:8080"
    environment:
      JENKINS_URL: http://localhost:${JENKINS_PORT:-8090}/
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD in .env}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo:ro

volumes:
  jenkins_home:
